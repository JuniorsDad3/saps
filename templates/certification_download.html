<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SAPS Digital Services</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css" />
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .header {
            background-color: #004ba0;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .header img {
            height: 60px;
            position: absolute;
            top: 10px;
        }
        .header .left-img {
            left: 10px;
        }
        .header .right-img {
            right: 10px;
        }
        .footer {
            background-color: #004ba0;
            color: white;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }
        .register-container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div class="container my-5 text-center">
        <h2>Download Certified Document</h2>
        <p>Your document has been successfully certified. You can download it below:</p>

        <div class="alert alert-success">
            <strong>Certified Document ID:</strong> {{ document_id }} <br>
            <strong>Certification Date:</strong> {{ certification_date }}
        </div>

        <a href="{{ url_for('static', filename='certified_docs/' + document_filename) }}" class="btn btn-primary" download>📥 Download Document</a>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">🏠 Back to Dashboard</a>
    </div>


    <div class="footer">
        <p>&copy; 2025 SAPS Digital Services</p>
    </div>

</body>
</html>
